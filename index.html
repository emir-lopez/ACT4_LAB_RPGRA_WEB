<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronForge | Biblioteca de Ejercicios</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">IRONFORGE <span>GYM</span></h1>
        </div>
    </header>

    <main class="container">
        <nav class="filters" id="filters">
            <button class="filter-btn" data-group="brazos">Brazos</button>
            <button class="filter-btn" data-group="piernas">Piernas</button>
            <button class="filter-btn" data-group="core">Abdomen</button>
            <button class="filter-btn" data-group="pecho">Pecho</button>
            <button class="filter-btn" data-group="espalda">Espalda</button>
            <button class="filter-btn" data-group="hombros">Hombros</button>
        </nav>

        <section class="status-container">
            <div id="loader" class="hidden">Cargando...</div>
            <div id="empty-message" class="hidden">No se encontraron movimientos para esta área.</div>
            <div id="error-message" class="error-box hidden"></div>
        </section>

        <section class="grid" id="grid">
            <!-- Las tarjetas de la API se inyectan dinámicamente aquí -->
        </section>

        <dialog id="exercise-modal" class="modal">
            <div class="modal-content">
                <button id="close-modal" class="close-btn" aria-label="Cerrar">&times;</button>
                <div class="modal-media">
                    <img id="modal-image" src="" alt="" loading="lazy">
                </div>
                <div class="modal-body">
                    <h2 id="modal-title" class="modal-title"></h2>
                    <div id="modal-description" class="modal-description"></div>
                </div>
            </div>
        </dialog>

    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
